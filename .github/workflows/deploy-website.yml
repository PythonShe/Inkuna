name: Deploy Website

# Deploys website/ to the Cloudflare Pages project "inkuna" (direct upload,
# no git integration). The site is built with Astro (fully static output,
# no client JS); website/dist is the deploy artifact.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  # The homepage bakes in the latest android-v* release's APK link at build
  # time; rebuild on every release publish so it never goes stale.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight deploy of the same site.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release events fire on a tag ref; always deploy the site from
          # main so a rebuild-for-APK-link never ships stale pages.
          ref: main

      - name: Guard required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]  || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. Set them in Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Installs the pnpm version pinned by website/package.json's
      # "packageManager" field and caches the pnpm store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml

      - name: Build site
        working-directory: website
        env:
          # Authenticates the build-time GitHub releases lookup (latest
          # Android APK link) past the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=inkuna --branch=main --commit-hash=${{ github.sha }}
