[workspace]
# Deliberately NOT bumped to "3" alongside the edition. Resolver 3 is
# MSRV-aware: it reads rust-version and holds dependencies back to what
# that version supports. Harmless while rust-version tracks newest stable,
# but it would silently start capping dependencies the moment the pin lags
# a release. Resolver 2 ignores rust-version entirely, so the pin below
# stays what it claims to be: a build-time assertion, not a resolver input.
resolver = "2"
members = [
    "crates/inkuna-content",
    "crates/inkuna-format",
    "crates/inkuna-engine",
    "crates/inkuna-core",
    "crates/inkuna-ffi",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
# Newest stable, per the stack policy — NOT edition 2024's 1.85 minimum.
# Nothing on the build path pins a toolchain (CI takes the runner image's
# rustup stable; scripts/build-core-*.sh pin RUSTC only to dodge the
# Homebrew rustc), so this is the one place the policy is machine-checked:
# an older compiler now fails by name instead of dying on an opaque edition
# parse error part-way through a tag-driven release build.
#
# This is a tripwire, not a floor — it fails builds on anything older, so
# it must be bumped in step with rustup stable. The release workflows call
# `rustup update stable` before cargo so CI can never trail it.
rust-version = "1.98"
license = "AGPL-3.0-only"

# Release profile is what CI and the build-core scripts ship (--release):
# full optimization, single codegen unit for best cross-crate inlining,
# fat LTO, debuginfo stripped. Panics stay unwinding so UniFFI can catch
# them at the boundary instead of aborting the host app.
#
# Symbol stripping is NOT set here on purpose: iOS links a staticlib out of
# this same profile and needs its symbol table to link at all. The Android
# cdylib strips further via CARGO_PROFILE_RELEASE_STRIP in
# scripts/build-core-android.sh.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "debuginfo"
