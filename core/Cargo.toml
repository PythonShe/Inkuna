[workspace]
# Deliberately NOT bumped to "3" alongside the edition. Resolver 3 is
# MSRV-aware: it reads rust-version and holds dependencies back to what
# that version supports. Since rust-version below is a minimum that lags
# between bumps, resolver 3 would start capping dependencies against a
# stale value — backwards from the newest-stable-everything policy.
# Resolver 2 ignores rust-version entirely, keeping it a build-time
# requirement check and nothing more.
resolver = "2"
members = [
    "crates/inkuna-content",
    "crates/inkuna-format",
    "crates/inkuna-engine",
    "crates/inkuna-core",
    "crates/inkuna-ffi",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
# A MINIMUM, not an exact pin: cargo only errors when rustc is OLDER than
# this, and says nothing when it is newer. So this does not and cannot
# enforce "newest stable" — it lags the moment the next release lands, and
# that is expected. What it buys is a named error ("requires rustc X")
# instead of an opaque edition parse failure part-way through a tag-driven
# release build when something genuinely stale tries to compile.
#
# Set to the newest stable the workspace has actually been verified on, so
# it never claims support for a compiler nobody tested. Bump it when the
# verified toolchain moves; if code starts relying on a newer rustc, bump
# it then too, or contributors get a confusing compile error rather than a
# version error.
#
# Choosing the compiler is rust-toolchain.toml's job, not this field's.
rust-version = "1.98"
license = "AGPL-3.0-only"

[workspace.dependencies]
memmap2 = "0.9.11"

# Release profile is what CI and the build-core scripts ship (--release):
# full optimization, single codegen unit for best cross-crate inlining,
# fat LTO, debuginfo stripped. Panics stay unwinding so UniFFI can catch
# them at the boundary instead of aborting the host app.
#
# Symbol stripping is NOT set here on purpose: iOS links a staticlib out of
# this same profile and needs its symbol table to link at all. The Android
# cdylib strips further via CARGO_PROFILE_RELEASE_STRIP in
# scripts/build-core-android.sh.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "debuginfo"
