[workspace]
# Deliberately NOT bumped to "3" alongside the edition. Resolver 3 is
# MSRV-aware: it would read the rust-version below and hold dependencies
# back to whatever 1.85 supports, which is exactly backwards from the
# repo's newest-stable-everything policy. Resolver 2 ignores rust-version,
# so the floor above stays pure documentation-plus-error-message.
resolver = "2"
members = [
    "crates/inkuna-content",
    "crates/inkuna-format",
    "crates/inkuna-engine",
    "crates/inkuna-core",
    "crates/inkuna-ffi",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
# The floor edition 2024 imposes. Nothing in CI or scripts/build-core-*.sh
# pins a toolchain — both just take rustup's stable — so this is what turns
# a too-old compiler into a named error instead of an opaque edition parse
# failure part-way through a tag-driven release build. It is a floor, not a
# cap: the stack policy is still newest stable everywhere.
rust-version = "1.85"
license = "AGPL-3.0-only"

# Release profile is what CI and the build-core scripts ship (--release):
# full optimization, single codegen unit for best cross-crate inlining,
# fat LTO, debuginfo stripped. Panics stay unwinding so UniFFI can catch
# them at the boundary instead of aborting the host app.
#
# Symbol stripping is NOT set here on purpose: iOS links a staticlib out of
# this same profile and needs its symbol table to link at all. The Android
# cdylib strips further via CARGO_PROFILE_RELEASE_STRIP in
# scripts/build-core-android.sh.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = "debuginfo"
