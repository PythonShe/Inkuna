[package]
name = "inkuna-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes src/test_support.rs (the fixture roster) outside cfg(test), so
# the export-parity-fixtures example can build the golden corpus.
test_support = ["dep:tempfile", "inkuna-content/test-support"]

[dependencies]
blake3 = "1.8"
cssparser = "0.37"
icu_segmenter = "2.3"
inkuna-content = { path = "../inkuna-content" }
quick-xml = { version = "0.41", features = ["escape-html"] }
rustybuzz = "0.20"
thiserror = "2"
log = "0.4"
tempfile = { version = "3", optional = true }
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-linebreak = "0.1.5"
imagesize = "0.15.0"

[dev-dependencies]
inkuna-content = { path = "../inkuna-content", features = ["test-support"] }
tempfile = "3"

[[example]]
name = "export-parity-fixtures"
required-features = ["test_support"]
