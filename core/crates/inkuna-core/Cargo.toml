[package]
name = "inkuna-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4.45"
chrono-tz = "0.10"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", features = ["escape-html"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
chardetng = "1"
encoding_rs = "0.8"
# Cover normalization: pure-Rust decode/resize, libwebp for lossy encode.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "rayon"] }
webp = { version = "0.3", default-features = false }
rayon = "1"
percent-encoding = "2"
log = "0.4"
regex = "1"
icu_casemap = "2"
icu_normalizer = "2"
# Library-wide full-text search: tantivy index under <data_dir>/index/,
# jieba word segmentation for ranked Chinese queries (see core/CLAUDE.md §4).
tantivy = "0.26"
jieba-rs = "0.10"

[dev-dependencies]
tempfile = "3"
