[package]
name = "inkuna-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4.45"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", features = ["escape-html"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
# Cover normalization: pure-Rust decode/resize, libwebp for lossy encode.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "rayon"] }
webp = { version = "0.3", default-features = false }
rayon = "1"
percent-encoding = "2"
log = "0.4"
icu_casemap = "2"
icu_normalizer = "2"

[dev-dependencies]
tempfile = "3"
