[package]
name = "inkuna-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
