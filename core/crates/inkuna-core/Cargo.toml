[package]
name = "inkuna-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inkuna-content = { path = "../inkuna-content" }
inkuna-format = { path = "../inkuna-format" }
# Unused until the reader engine lands (M6); the dependency edge is the
# point — the crate graph is final from here on.
inkuna-engine = { path = "../inkuna-engine" }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4.45"
chrono-tz = "0.10"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
# V8 rebaseline: parsing legacy Readium locator JSON into content coordinates.
serde_json = "1.0.151"
blake3 = "1"
# Cover normalization: pure-Rust decode/resize, libwebp for lossy encode.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "rayon"] }
webp = { version = "0.3", default-features = false }
rayon = "1"
log = "0.4"
icu_casemap = "2"
icu_normalizer = "2"
# Library-wide full-text search: tantivy index under <data_dir>/index/,
# jieba word segmentation for ranked Chinese queries (see core/CLAUDE.md §4).
tantivy = "0.26"
jieba-rs = "0.10"

[dev-dependencies]
inkuna-content = { path = "../inkuna-content", features = ["test-support"] }
inkuna-format = { path = "../inkuna-format", features = ["test-support"] }
encoding_rs = "0.8"
tempfile = "3"
