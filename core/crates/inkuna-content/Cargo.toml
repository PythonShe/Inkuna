[package]
name = "inkuna-content"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes the EPUB fixture builders to dependents' test suites.
test-support = []

[dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", features = ["escape-html"] }
percent-encoding = "2"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
