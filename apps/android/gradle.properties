# 4g, not 2g: R8 has to load every class it is about to shrink, and
# material-icons-extended alone contributes ~42k classes (~78 MB of dex).
# The release build OOMs the daemon at 2g.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Latest Homebrew OpenJDK; if a Gradle release ever lags behind it, point
# this at Android Studio's JBR as the fallback.
org.gradle.java.home=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home
