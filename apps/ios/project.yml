name: Inkuna
options:
  bundleIdPrefix: app.inkuna
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Treat Icon Composer .icon packages as single files; without this XcodeGen
  # expands the package contents and Xcode no longer recognizes the icon
  # (https://github.com/yonaskolb/XcodeGen/issues/1556).
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  # Being removed: the Rust core owns layout now and the shells draw the
  # glyph runs it emits, so the navigator has no job left. The dependency
  # survives only until the engine reader replaces the Readium open path;
  # nothing new may be built on it. Still pinned exactly until then, so the
  # interim path cannot drift under a lockfile-less regenerated project.
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The Rust core ships arm64-only simulator slices.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "0.8.6"
    CURRENT_PROJECT_VERSION: "26082002"
targets:
  Inkuna:
    type: application
    platform: iOS
    sources:
      - Inkuna
      # Liquid Glass icon (iOS 26+); Assets.xcassets carries the flat
      # fallback for iOS 18-25, where .icon back-deployment is unreliable.
      - path: AppIcon.icon
      - path: Generated
        optional: true
      # The repo-root font set, the single source of truth shared with the
      # Android shell and the core's shaper. A folder reference, not a
      # group: the bundle then holds a real `fonts/` directory that the
      # core can be pointed at wholesale, and new faces need no project
      # edit. Every file ships — the CJK .ttc faces included — because the
      # core picks a face per script at shaping time.
      - path: ../../assets/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/InkunaCore.xcframework
        embed: false
      # Only the products the reader consumes. ReadiumAdapterGCDWebServer is
      # deliberately absent: since 3.x the EPUB navigator no longer needs an
      # HTTP server (its httpServer initializer is deprecated in 3.11.0).
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumStreamer
          - ReadiumNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.inkuna.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Inkuna/Info.plist
      properties:
        # Only standard OS crypto (HTTPS-exempt); answers the export
        # compliance question so TestFlight builds don't wait on a manual
        # answer in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # ProMotion: without this key, app-driven Core Animation and
        # CADisplayLink are clamped to 60 Hz on ProMotion iPhones no
        # matter what frame-rate range the code asks for. (System-driven
        # scrolling is unaffected either way; iPad is never clamped.)
        CADisableMinimumFrameDurationOnPhone: true
        # Generated launch screen with the app background color so night
        # launches don't flash light (the generated plist can't set it).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Registration exists for UIKit font previews only — the font
        # picker draws its samples with these. The reading surface needs
        # none of it: it draws glyph runs through Core Text from the file
        # paths in the core's `FontEntry.file_path`, which reads the
        # bundled `fonts/` directory directly. Only the four Latin faces
        # the picker offers are listed; the rest of the directory ships
        # unregistered. Paths are folder-relative — the fonts arrive as a
        # folder reference, not flattened into the bundle root.
        UIAppFonts:
          - fonts/NotoSerif.ttf
          - fonts/NotoSerif-Italic.ttf
          - fonts/NotoSans.ttf
          - fonts/NotoSans-Italic.ttf
        # App Store validation (90474) rejects a bundle with no declared
        # orientations. iPhone: no upside-down (standard on notched devices).
        # iPad: all four are mandatory for multitasking support.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # "Open with Inkuna" from Files, Mail, Safari, and the share sheet.
        # `org.idpf.epub-container` and `public.plain-text` are
        # system-declared types (UTType.epub / .plainText), so they need no
        # UTImportedTypeDeclarations entry — declaring one would shadow the
        # system's with a weaker definition. MOBI and AZW3 have no system
        # UTI, so they ARE declared below under the standard Amazon
        # identifiers other reader apps import.
        # Rank Alternate, not Owner: Apple Books owns EPUB on a stock
        # device, and claiming Owner would silently steal every EPUB tap
        # from it. Same courtesy for the other formats.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.amazon.mobi-pocket-ebook
            UTTypeDescription: Mobipocket ebook
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobi
                - prc
          - UTTypeIdentifier: com.amazon.azw3-ebook
            UTTypeDescription: Kindle AZW3 ebook
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - azw3
                - azw
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: Mobipocket ebook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.amazon.mobi-pocket-ebook
          - CFBundleTypeName: Kindle AZW3 ebook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.amazon.azw3-ebook
          - CFBundleTypeName: Plain text book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
        # Deliberately NOT opening documents in place: iOS then hands the
        # app a copy in Documents/Inbox instead of a live reference to the
        # reader's file. That is exactly the contract the core wants — it
        # takes ownership of its own copy of every book — and it means an
        # inbound document never depends on a provider staying reachable.
        # `ImportFlow` deletes the Inbox copy once the core has its own.
        LSSupportsOpeningDocumentsInPlace: false
