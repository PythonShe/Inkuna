name: Inkuna
options:
  bundleIdPrefix: app.inkuna
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Treat Icon Composer .icon packages as single files; without this XcodeGen
  # expands the package contents and Xcode no longer recognizes the icon
  # (https://github.com/yonaskolb/XcodeGen/issues/1556).
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  # Readium renders; the Rust core never does. Pinned exactly: navigator
  # behavior and the locator contract must not drift under a lockfile-less
  # regenerated project.
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The Rust core ships arm64-only simulator slices.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    MARKETING_VERSION: "0.5.3"
    CURRENT_PROJECT_VERSION: "26081602"
targets:
  Inkuna:
    type: application
    platform: iOS
    sources:
      - Inkuna
      # Liquid Glass icon (iOS 26+); Assets.xcassets carries the flat
      # fallback for iOS 18-25, where .icon back-deployment is unreliable.
      - path: AppIcon.icon
      - path: Generated
        optional: true
    dependencies:
      - framework: Frameworks/InkunaCore.xcframework
        embed: false
      # Only the products the reader consumes. ReadiumAdapterGCDWebServer is
      # deliberately absent: since 3.x the EPUB navigator no longer needs an
      # HTTP server (its httpServer initializer is deprecated in 3.11.0).
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumStreamer
          - ReadiumNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.inkuna.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Inkuna/Info.plist
      properties:
        # Generated launch screen with the app background color so night
        # launches don't flash light (the generated plist can't set it).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # App Store validation (90474) rejects a bundle with no declared
        # orientations. iPhone: no upside-down (standard on notched devices).
        # iPad: all four are mandatory for multitasking support.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # "Open with Inkuna" from Files, Mail, Safari, and the share sheet.
        # `org.idpf.epub-container` is a system-declared type (UTType.epub),
        # so no UTImportedTypeDeclarations entry is needed — declaring one
        # would shadow the system's with a weaker definition.
        # Rank Alternate, not Owner: Apple Books owns EPUB on a stock
        # device, and claiming Owner would silently steal every EPUB tap
        # from it.
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
        # Deliberately NOT opening documents in place: iOS then hands the
        # app a copy in Documents/Inbox instead of a live reference to the
        # reader's file. That is exactly the contract the core wants — it
        # takes ownership of its own copy of every book — and it means an
        # inbound document never depends on a provider staying reachable.
        # `ImportFlow` deletes the Inbox copy once the core has its own.
        LSSupportsOpeningDocumentsInPlace: false
